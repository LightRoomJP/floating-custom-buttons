name: Release extension

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: extension-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read manifest version
        id: version
        shell: bash
        run: |
          version="$(jq -r '.version' manifest.json)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Check existing release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package extension
        if: steps.existing.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          runtime_files=(
            manifest.json background.js
            content.css content.js popup.css popup.html popup.js
            README.md LICENSE
          )
          mkdir -p dist/chrome/icons dist/chrome/scripts dist/edge/icons dist/edge/scripts
          cp "${runtime_files[@]}" dist/chrome/
          cp "${runtime_files[@]}" dist/edge/
          cp icons/icon.svg icons/icon16.png icons/icon32.png icons/icon48.png icons/icon128.png dist/chrome/icons/
          cp icons/icon.svg icons/icon16.png icons/icon32.png icons/icon48.png icons/icon128.png dist/edge/icons/
          cp scripts/generate_icons.py dist/chrome/scripts/
          cp scripts/generate_icons.py dist/edge/scripts/
          cp docs/INSTALL_CHROME.md dist/chrome/INSTALL.md
          cp docs/INSTALL_EDGE.md dist/edge/INSTALL.md
          (cd dist/chrome && zip -r "../floating-custom-buttons-chrome-v${VERSION}.zip" .)
          (cd dist/edge && zip -r "../floating-custom-buttons-edge-v${VERSION}.zip" .)

      - name: Create GitHub release
        if: steps.existing.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          gh release create "$TAG" \
            "dist/floating-custom-buttons-chrome-v${VERSION}.zip" \
            "dist/floating-custom-buttons-edge-v${VERSION}.zip" \
            --target main \
            --title "$TAG" \
            --generate-notes
